name: estudo_ristoapp

services:
  db:
    image: postgres:16-alpine
    container_name: estudo_ristoapp-db
    environment:
      POSTGRES_USER: ristoapp
      POSTGRES_PASSWORD: ristoapp_dev_password
      POSTGRES_DB: ristoapp
    ports:
      - "5433:5432" # Alterado para 5433 para não conflitar com a porta 5432
    volumes:
      - estudo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ristoapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estudo_ristoapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estudo_ristoapp-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ristoapp:ristoapp_dev_password@db:5432/ristoapp}
    ports:
      - "8001:8000" # Alterado para 8001 para não conflitar com a porta 8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/main.py:/app/main.py
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    networks:
      - estudo_ristoapp-network
    command: fastapi dev ./src/main.py --host 0.0.0.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estudo_ristoapp-frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:8001" # Apontando para a nova porta do backend de estudos
    ports:
      - "5174:5173" # Alterado para 5174 para não conflitar com a porta 5173
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    networks:
      - estudo_ristoapp-network
    command: npm run dev -- --host

volumes:
  estudo_postgres_data:

networks:
  estudo_ristoapp-network:
    driver: bridge